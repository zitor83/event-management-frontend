<main class="login-page">
  <section class="login-card">
    <div class="login-mark" aria-hidden="true">EV</div>
    <p class="eyebrow">Gestión de eventos</p>
    <h1>{{ title }}</h1>
    <p class="login-intro">Accede para consultar y administrar tus eventos.</p>

    <form (ngSubmit)="login()">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input id="username" name="username" [(ngModel)]="username" autocomplete="username" required>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required>
      </div>

      <button class="login-button" type="submit">Iniciar sesión</button>
    </form>

    @if (errorMessage()) {
      <p class="login-error" role="alert">{{ errorMessage() }}</p>
    }
  </section>
</main>
